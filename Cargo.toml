[package]
name = "rsomics-phylo"
version = "0.2.0"
description = "Alignment, distance, tree inference, comparison, and phylogenetic statistics"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-phylo"
homepage = "https://github.com/omics-rust/rsomics-phylo"
documentation = "https://docs.rs/rsomics-phylo"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"
categories = ["science", "command-line-utilities"]
keywords = ["phylogenetics", "newick", "distance", "bioinformatics", "tree"]

[lib]
name = "rsomics_phylo"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rsomics-phylo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
rsomics-common = "0.12"
rsomics-help = "0.4"
rsomics-phylo-tree = "0.2"
rsomics-seqio = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "inference"
harness = false

[[bench]]
name = "tree"
harness = false
